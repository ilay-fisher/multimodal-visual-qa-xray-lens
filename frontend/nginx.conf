# Edge abuse protection (per client IP). This file is included inside http{}, so the
# zones below may be declared outside the server block.
#
# Why: POST /api/inspect decodes and diffs up to 8 MB images with OpenCV (CPU heavy) and
# /api/analyze-roi can hit the paid cloud VLM. Limits here stop floods before they reach
# the backend. Keyed on $binary_remote_addr (compact). Behind a CDN/proxy, restore the
# real client IP first (real_ip_header), otherwise all visitors share one bucket.
#
# Strict: expensive endpoints, 10 req/min sustained, burst of 5 served immediately.
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/m;
# Loose: everything else under /api/ (health, config, ...), 60 req/min, burst of 20.
limit_req_zone $binary_remote_addr zone=api_light:10m rate=60r/m;
# Concurrent connections per IP (SSE streams hold a connection open for their duration).
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Reject with 429 Too Many Requests instead of nginx's default 503.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads of baseline/target images.
    client_max_body_size 20m;

    limit_conn conn_per_ip 10;

    # Expensive endpoints. The proxy lines are repeated from the generic /api/ block
    # because nginx cannot share them without an extra include file; keep the two in sync.
    # No buffering so SSE tokens reach the browser immediately.
    location ~ ^/api/(inspect|analyze-roi)$ {
        limit_req zone=api_heavy burst=5 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Rest of the API. Docker's healthcheck probes the backend directly (not via nginx),
    # so rate limiting cannot make it fail.
    location /api/ {
        limit_req zone=api_light burst=20 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Single page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
